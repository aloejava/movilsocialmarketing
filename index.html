<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Móvil Social Marketing | Demo</title>
  
  <style>
    /* Estilos corregidos para la barra de navegación y el logo */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background-color: #0b0f19;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    /* Corrección del logo en la barra superior */
    .navbar-brand img {
      height: 36px;
      width: auto;
      object-fit: contain;
      background: transparent;
      border: none;
      box-shadow: none;
    }

    .brand-text {
      color: #ffffff;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 1px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Ajuste responsivo para smartphones */
    @media (max-width: 768px) {
      .navbar-brand img {
        height: 28px;
      }
      .brand-text {
        font-size: 1rem;
      }
    }

    /* Estilos para el formulario limpio */
    .demo-section {
      max-width: 600px;
      margin: 40px auto;
      padding: 30px;
      background-color: #111827;
      border-radius: 12px;
      text-align: center;
      font-family: system-ui, -apple-system, sans-serif;
      color: #ffffff;
    }

    .demo-section h2 {
      margin-bottom: 8px;
      font-size: 1.5rem;
      font-weight: 600;
    }

    .demo-section .subtitle {
      color: #9ca3af;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background-color: #1f2937;
      border: 1px solid #374151;
      border-radius: 6px;
      color: #ffffff;
      font-size: 0.9rem;
      box-sizing: border-box;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background-color: #059669;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-primary:hover {
      background-color: #10b981;
    }

    .disclaimer {
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 12px;
    }

    /* Estructura para el encabezado de propuestas enviadas por email */
    .proposal-header {
      text-align: center;
      padding: 20px;
      background-color: #0b0f19;
    }

    .proposal-header img {
      width: 100px;
      height: auto;
    }

    .proposal-header h1 {
      margin: 10px 0 2px 0;
      font-size: 20px;
      color: #ffffff;
      letter-spacing: 2px;
    }

    .proposal-header p {
      margin: 0;
      font-size: 12px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- 1. BARRA DE NAVEGACIÓN WEB / SMARTPHONE -->
  <header class="navbar">
    <a href="#" class="navbar-brand">
      <!-- Asegúrate de cambiar 'logo-msm-plano.png' por la ruta real de tu imagen vectorial plana sin fondo -->
      <img src="logo-msm-plano.png" alt="MSM Isotipo" />
      <span class="brand-text">MSM</span>
    </a>
  </header>

  <!-- 2. FORMULARIO DE DEMO INTERACTIVA (SIN EMOJIS) -->
  <section class="demo-section">
    <h2>Solicita tu Demo Interactiva Gratis</h2>
    <p class="subtitle">
      Generamos una versión funcional de tu sitio web en una App para que la pruebes por 7 días.
    </p>

    <form id="demo-form">
      <div class="form-group">
        <input type="text" placeholder="Nombre de la Empresa / Marca" required />
        <input type="url" placeholder="URL de tu Sitio Web Actual" required />
      </div>
      <div class="form-group">
        <input type="email" placeholder="Correo Electrónico Corporativo" required />
      </div>

      <button type="submit" class="btn-primary">
        Solicitar App Demo Gratis
      </button>
    </form>

    <p class="disclaimer">
      Garantía de privacidad. Tu información está segura con nosotros.
    </p>
  </section>

  <!-- 3. ENCABEZADO EXCLUSIVO PARA PROPUESTAS COMERCIALES Y EMAILS -->
  <!-- Utiliza este bloque únicamente en las carátulas de correos o documentos donde se requiera la conjugación completa -->
  <div class="proposal-header">
    <img src="logo-msm-plano.png" alt="Logo MSM" />
    <h1>MSM</h1>
    <p>Móvil Social Marketing SAS</p>
  </div>

</body>
</html>
